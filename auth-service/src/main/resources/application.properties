spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/family_calendar
spring.datasource.username=family_user
spring.datasource.password=family_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=change-this-secret-key-change-this-secret-key-123456
app.jwt.expiration-ms=86400000